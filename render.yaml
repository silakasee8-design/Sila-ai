services:
  - type: web
    name: sila-ai
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sila-db
          property: connectionString
  - type: pserv
    name: sila-db
    region: oregon
    plan: free
    databaseName: sila
    userName: sila
